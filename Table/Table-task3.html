<!DOCTYPE html>
<html>
    <head>
        <title>Table with rowspan and colspan</title>
    </head>
    <body>
        <div>
            <table border="2">
                <caption>Student Mark List</caption>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Subject</th>
                        <th>Mark</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td rowspan="2">Ravi</td>
                        <td>HTML</td>
                        <td>90</td>
                    </tr>
                     <tr>
                        <td>CSS</td>
                        <td>85</td>
                    </tr>
                    <tr>
                        <td rowspan="2">Kumar</td>
                        <td>HTML</td>
                        <td>88</td>
                    </tr>
                     <tr>
                        <td>CSS</td>
                        <td>92</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
